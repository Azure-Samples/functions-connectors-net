# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: functions-connectors-net-salesforce-polling
services:
  function-app:
    project: .
    language: dotnet
    host: function
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./infra/scripts/postdeploy.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: bash ./infra/scripts/postdeploy.sh
      interactive: true
      continueOnError: false
