# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: functions-connectors-net-onedrive-polling
services:
  function-app:
    host: function
    project: .
    language: csharp
hooks:
  preprovision:
    shell: pwsh
    run: |
      $folderId = "$env:ONEDRIVE_FOLDER_ID".Trim()
      if (-not $folderId -or $folderId -ieq 'root') {
        throw "Set ONEDRIVE_FOLDER_ID to a connector-returned folder ID with 'azd env set'. The literal 'root' is rejected by the connector at runtime ('Invalid fileId'). See README: Folder ID setup."
      }
    continueOnError: false
  postdeploy:
    shell: pwsh
    run: ./infra/scripts/postdeploy.ps1
    interactive: true
    continueOnError: false
