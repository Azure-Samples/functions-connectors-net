# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: azure-functions-dataverse-polling
requiredVersions:
  azd: ">= 1.33.0"
infra:
  layers:
    - name: base
      path: infra
      module: main
    - name: triggers
      path: infra
      module: poll-triggers
      dependsOn: [base]
      hooks:
        preprovision:
          windows:
            shell: pwsh
            run: dotnet run --file ./scripts/PollingSetup.cs -- prepare
            interactive: true
          posix:
            shell: sh
            run: dotnet run --file ./scripts/PollingSetup.cs -- prepare
            interactive: true
    - name: app
      path: infra
      module: function-app
      dependsOn: [triggers]
      hooks:
        preprovision:
          windows:
            shell: pwsh
            run: dotnet run --file ./scripts/PollingSetup.cs -- verify
          posix:
            shell: sh
            run: dotnet run --file ./scripts/PollingSetup.cs -- verify
workflows:
  up:
    - azd: package --all
    - azd: provision base
    - azd: provision triggers
    - azd: provision app
    - azd: deploy --all
services:
  function-app:
    project: .
    language: dotnet
    host: function
hooks:
  predeploy:
    windows:
      shell: pwsh
      run: dotnet run --file ./infra/scripts/PollingSetup.cs -- finish
    posix:
      shell: sh
      run: dotnet run --file ./infra/scripts/PollingSetup.cs -- finish
