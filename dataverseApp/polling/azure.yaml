name: azure-functions-dataverse-polling
metadata:
  template: azure-functions-dataverse-polling@0.0.1-alpha
hooks:
  preprovision:
    shell: pwsh
    run: ./infra/scripts/validate-events.ps1
    continueOnError: false
  postdeploy:
    shell: pwsh
    run: ./infra/scripts/postdeploy.ps1
    interactive: true
    continueOnError: false
services:
  function-app:
    project: .
    language: dotnet
    host: function
