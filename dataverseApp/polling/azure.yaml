name: azure-functions-dataverse-polling
metadata:
  template: azure-functions-dataverse-polling@0.0.1-alpha
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./infra/scripts/postdeploy.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: bash ./infra/scripts/postdeploy.sh
      interactive: true
      continueOnError: false
services:
  function-app:
    project: .
    language: dotnet
    host: function
