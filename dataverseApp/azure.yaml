name: azure-functions-dataverse-trigger
metadata:
  template: azure-functions-dataverse-trigger@0.0.1-alpha
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./infra/scripts/postdeploy.ps1
    posix:
      shell: sh
      run: ./infra/scripts/postdeploy.sh
services:
  function-app:
    project: .
    language: dotnet
    host: function
